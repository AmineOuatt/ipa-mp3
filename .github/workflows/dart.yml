name: Mobile-ipa-apk-build

on:
  push:
    branches:
      - main
      - feature/mp360-upgrade
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS IPA Build & Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: arm64
      - run: flutter pub get

      - run: pod repo update
        working-directory: ios

      - run: flutter build ios --release --no-codesign

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Package IPA
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP360-iOS-IPA
          path: build/ios/iphoneos/FlutterIpaExport.ipa

      - name: Upload IPA to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          asset_name: MP360-${{ github.ref_type == 'tag' && github.ref_name || 'v4.0' }}.ipa
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'v4.0' }}
          release_name: "MP360 Release ${{ github.ref_type == 'tag' && github.ref_name || 'v4.0' }}"
          overwrite: true
          body: |
            ### MP360 Release
            - Persistent background playback with media notification (Android & iOS).
            - Custom Flutter Audio Notification bar across all screens with waveform, track swapping, and 5s skip.
            - Enhanced Android Home Screen widget compatible with Samsung Galaxy (One UI) & Redmi (MIUI/HyperOS).
            - Hardened in-app YouTube downloader: multi-client Innertube fallback, candidate stream fallback (audio-only + muxed), 15s connection timeout, and atomic .part file handling.
            - Direct full Quran reciter/imam suwar folder download.
            - Single surah download integrated into the reactive download queue.
            - Reactive download queue and status bar progress notifications.

  build-android:
    name: 🤖 Android APK Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP360-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/app-release.apk
          asset_name: MP360-${{ github.ref_type == 'tag' && github.ref_name || 'v4.0' }}.apk
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'v4.0' }}
          release_name: "MP360 Release ${{ github.ref_type == 'tag' && github.ref_name || 'v4.0' }}"
          overwrite: true
          body: |
            ### MP360 Release
            - Persistent background playback with media notification (Android & iOS).
            - Custom Flutter Audio Notification bar across all screens with waveform, track swapping, and 5s skip.
            - Enhanced Android Home Screen widget compatible with Samsung Galaxy (One UI) & Redmi (MIUI/HyperOS).
            - Hardened in-app YouTube downloader: multi-client Innertube fallback, candidate stream fallback (audio-only + muxed), 15s connection timeout, and atomic .part file handling.
            - Direct full Quran reciter/imam suwar folder download.
            - Single surah download integrated into the reactive download queue.
            - Reactive download queue and status bar progress notifications.
